<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 200" width="120" height="200">
  <rect x="28" y="108" width="64" height="92" rx="4" fill="#1a1a2a"/>
  <rect x="50" y="88" width="20" height="24" fill="#c8c8c8"/>
  <!-- Head pale grey -->
  <ellipse cx="60" cy="68" rx="28" ry="32" fill="#c8c8c8"/>
  <!-- Hair normal-ish -->
  <ellipse cx="60" cy="40" rx="28" ry="13" fill="#2a2a2a"/>
  <rect x="32" y="40" width="56" height="20" fill="#2a2a2a"/>
  <!-- Eyes: no blinking state — wide open, dark iris, no blink line -->
  <ellipse cx="47" cy="66" rx="8" ry="9" fill="#fff"/>
  <ellipse cx="73" cy="66" rx="8" ry="9" fill="#fff"/>
  <!-- Dark iris, dilated -->
  <ellipse cx="47" cy="66" rx="6" ry="7" fill="#080808"/>
  <ellipse cx="73" cy="66" rx="6" ry="7" fill="#080808"/>
  <!-- Tiny highlight off-center -->
  <ellipse cx="44" cy="63" rx="1.5" ry="1.5" fill="#ffffff" opacity="0.6"/>
  <ellipse cx="70" cy="63" rx="1.5" ry="1.5" fill="#ffffff" opacity="0.6"/>
  <!-- No eyebrows = uncanny -->
  <!-- Mouth: frozen perfect smile -->
  <path d="M46 84 Q60 92 74 84" stroke="#888" stroke-width="2" fill="rgba(180,180,180,0.2)"/>
  <!-- Visible teeth — too perfect -->
  <rect x="50" y="84" width="20" height="5" rx="1" fill="#f0f0f0"/>
  <line x1="55" y1="84" x2="55" y2="89" stroke="#ccc" stroke-width="0.5"/>
  <line x1="60" y1="84" x2="60" y2="89" stroke="#ccc" stroke-width="0.5"/>
  <line x1="65" y1="84" x2="65" y2="89" stroke="#ccc" stroke-width="0.5"/>
  <ellipse cx="32" cy="68" rx="5" ry="8" fill="#c8c8c8"/>
  <ellipse cx="88" cy="68" rx="5" ry="8" fill="#c8c8c8"/>
</svg>
