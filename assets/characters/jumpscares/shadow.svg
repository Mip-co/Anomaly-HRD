<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <rect width="400" height="300" fill="#000"/>
  <!-- Shadow figure, tall, in doorway -->
  <rect x="155" y="20" width="90" height="260" fill="#0a0808"/>
  <!-- Head -->
  <ellipse cx="200" cy="50" rx="38" ry="42" fill="#0a0808"/>
  <!-- Arms wide -->
  <rect x="40"  y="100" width="115" height="12" rx="6" fill="#080606" transform="rotate(15,40,106)"/>
  <rect x="245" y="100" width="115" height="12" rx="6" fill="#080606" transform="rotate(-15,360,106)"/>
  <!-- Eyes — two dim red dots -->
  <ellipse cx="185" cy="48" rx="6" ry="5" fill="#440000" opacity="0.8"/>
  <ellipse cx="215" cy="48" rx="6" ry="5" fill="#440000" opacity="0.8"/>
  <ellipse cx="185" cy="48" rx="3" ry="2.5" fill="#cc0000" opacity="0.6"/>
  <ellipse cx="215" cy="48" rx="3" ry="2.5" fill="#cc0000" opacity="0.6"/>
  <!-- Noise/grain texture -->
  <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4"/><feColorMatrix type="saturate" values="0"/><feBlend in="SourceGraphic" mode="multiply"/></filter>
  <rect width="400" height="300" fill="rgba(10,5,5,0.4)" filter="url(#grain)"/>
  <!-- Vignette -->
  <radialGradient id="v2" cx="50%" cy="50%" r="60%">
    <stop offset="30%" stop-color="transparent"/>
    <stop offset="100%" stop-color="#000" stop-opacity="0.98"/>
  </radialGradient>
  <rect width="400" height="300" fill="url(#v2)"/>
</svg>
